plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.minhphuhvac.daikinquote'
    compileSdk 34

    defaultConfig {
        applicationId "vn.minhphuhvac.daikinquote"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
